name: Validar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Preparar pnpm e Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar lint
        run: pnpm run lint

      - name: Executar testes
        run: pnpm run test

      - name: Gerar aplicacao
        run: pnpm run build

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Preparar pnpm e Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar testes E2E
        run: pnpm run test:e2e

  deploy:
    name: Publicar
    needs: [build, e2e]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
